<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wildwash API directory</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f7f5;
      color: #17352b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header {
      padding: 52px max(24px, calc((100% - 1120px) / 2));
      background: linear-gradient(125deg, #123f31, #167653);
      color: #fff;
    }
    .eyebrow { margin: 0 0 10px; color: #a9e3c9; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 48px); letter-spacing: -.04em; }
    header p:last-child { margin: 12px 0 0; color: #d3eee2; }
    main { width: min(1120px, calc(100% - 40px)); margin: 34px auto 64px; }
    .summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .summary h2 { margin: 0; font-size: 18px; }
    .count { border-radius: 999px; padding: 7px 12px; background: #e0efe8; color: #176444; font-size: 13px; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
    .endpoint {
      display: block; min-width: 0; padding: 18px; border: 1px solid #dce8e1; border-radius: 14px;
      background: #fff; color: inherit; text-decoration: none; transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .endpoint:hover, .endpoint:focus-visible { transform: translateY(-2px); border-color: #7bb99b; box-shadow: 0 10px 24px #17352b12; outline: none; }
    .name { display: block; margin-bottom: 10px; color: #34775b; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; overflow-wrap: anywhere; }
    code { color: #17352b; font: 600 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
    @media (max-width: 560px) { header { padding-top: 38px; padding-bottom: 38px; } main { width: calc(100% - 28px); margin-top: 24px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Wildwash · Backend</p>
    <h1>API directory</h1>
    <p>Browse the available backend endpoints. Select a route to open it.</p>
  </header>
  <main>
    <div class="summary">
      <h2>Available routes</h2>
      <span class="count">{{ endpoints|length }} endpoints</span>
    </div>
    <div class="grid">
      {% for endpoint in endpoints %}
        <a class="endpoint" href="{{ endpoint.href }}">
          <span class="name">{{ endpoint.name }}</span>
          <code>{{ endpoint.path }}</code>
        </a>
      {% endfor %}
    </div>
  </main>
</body>
</html>
